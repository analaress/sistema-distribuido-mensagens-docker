services:
  app1:
    image: ${IMAGE_NAME:-mensagens-app:1.0}
    environment:
      NOME_SERVICO: app1
      PORTA_APLICACAO: 5000
      SERVICOS_REPLICACAO: app2,app3
    ports:
      - "5001:5000"
    volumes:
      - mensagens_compartilhadas:/data
    networks:
      rede_mensagens:
        aliases:
          - app1
    deploy:
      placement:
        constraints:
          - node.labels.mensagens_storage == true

  app2:
    image: ${IMAGE_NAME:-mensagens-app:1.0}
    environment:
      NOME_SERVICO: app2
      PORTA_APLICACAO: 5000
      SERVICOS_REPLICACAO: app1,app3
    ports:
      - "5002:5000"
    volumes:
      - mensagens_compartilhadas:/data
    networks:
      rede_mensagens:
        aliases:
          - app2
    deploy:
      placement:
        constraints:
          - node.labels.mensagens_storage == true

  app3:
    image: ${IMAGE_NAME:-mensagens-app:1.0}
    environment:
      NOME_SERVICO: app3
      PORTA_APLICACAO: 5000
      SERVICOS_REPLICACAO: app1,app2
    ports:
      - "5003:5000"
    volumes:
      - mensagens_compartilhadas:/data
    networks:
      rede_mensagens:
        aliases:
          - app3
    deploy:
      placement:
        constraints:
          - node.labels.mensagens_storage == true

volumes:
  mensagens_compartilhadas:

networks:
  rede_mensagens:
    driver: overlay
    attachable: true
